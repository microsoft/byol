# Instruct Model Evaluation - Māori (mri)
# 0-shot evaluation with chat template

evaluation:
  results_dir: "results/eval"
  gpus: "0"
  batch_size: auto:4
  apply_chat_template: true

models:
  - name: "model"
    path: "google/gemma-3-4b-it"
    dtype: "bfloat16"
    trust_remote_code: true

lm_eval:
  include_path: "tasks"
  log_samples: false

tasks:
  - name: "global_mmlu_mri_gen_0shot"
    enabled: true
    apply_chat_template: true

  - name: "xwinograd_mri"
    enabled: true
    apply_chat_template: true
    num_fewshot: 0

  - name: "xcopa_mri"
    enabled: true
    apply_chat_template: true
    num_fewshot: 0

  - name: "xnli_mri"
    enabled: true
    apply_chat_template: true
    num_fewshot: 0
    batch_size: auto:2

  - name: "mgsm_direct_mri"
    enabled: true
    apply_chat_template: true
    num_fewshot: 0

  - name: "hellaswag_mri"
