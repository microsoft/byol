# Instruct Model Evaluation - Chichewa (nya)
# 0-shot evaluation with chat template

evaluation:
  results_dir: "results/eval"
  gpus: "0"
  batch_size: auto:4
  apply_chat_template: true

models:
  - name: "model"
    path: "google/gemma-3-4b-it"
    dtype: "bfloat16"
    trust_remote_code: true

lm_eval:
  include_path: "tasks"
  log_samples: false

tasks:
  - name: "global_mmlu_nya_gen_0shot"
    enabled: true
    apply_chat_template: true

  - name: "xwinograd_nya"
    enabled: true
    apply_chat_template: true
    num_fewshot: 0

  - name: "xcopa_nya"
    enabled: true
    apply_chat_template: true
    num_fewshot: 0

  - name: "xnli_nya"
    enabled: true
    apply_chat_template: true
    num_fewshot: 0
    batch_size: auto:2

  - name: "mgsm_direct_nya"
    enabled: true
    apply_chat_template: true
    num_fewshot: 0

  - name: "hellaswag_nya"
    enabled: true
