[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "byol"
version = "0.1.0"
description = "BYOL: Bring Your Own Language Into LLMs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AI for Good Lab, Microsoft Research"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core
    "datasets>=2.14.0",
    "sacremoses>=0.0.53",
    "tqdm>=4.65.0",
    "torch>=2.0.0",
    "evaluate>=0.4.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.25.0",
    # Azure SDK
    "openai>=1.0.0",
    "azure-identity>=1.14.0",
    "azure-ai-translation-text>=1.0.0",
    "azure-ai-inference>=1.0.0b9",
    "azure-keyvault-secrets>=4.7.0",
    # HuggingFace
    "huggingface-hub>=0.20.0",
    # Eval dependencies
    "langdetect>=1.0.9",
    "immutabledict>=4.2.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
google = [
    "google-cloud-translate>=3.11.0",
]
all = [
    "google-cloud-translate>=3.11.0",
]

[project.scripts]
byol-lra = "byol.language_resource_assessment.cli:main"
byol-eval = "byol.eval.cli:main"
byol-train = "byol.train.cli:main"
byol-data-prep = "byol.data_prep.cli:main"
byol-pipeline = "byol.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["byol*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
