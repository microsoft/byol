include: cot_yaml
dataset_name: nya
dataset_kwargs:
  data_files:
    train: data/nya/eval/mgsm_train_english2nya_gpt5_translated.jsonl
    test:  data/nya/eval/mgsm_test_english2nya_gpt5_translated.jsonl
doc_to_target: '{% if answer is not none %}{{answer[24:]}}{% else %}{{answer_number|string}}{% endif %}'
doc_to_text: '{% if answer is not none %}{{question+"\nMayankho Paso ndi Paso:"}}{% else %}{{"Funso: "+question+"\nMayankho Paso ndi Paso:"}}{% endif %}'
filter_list:
- filter:
  - function: regex
    regex_pattern: Yankho ndi (\-?[0-9\.\,]+)
  - function: take_first
  name: strict-match
- filter:
  - function: regex
    group_select: -1
    regex_pattern: (-?[$0-9.,]{{2,}})|(-?[0-9]+)
  - function: take_first
  name: flexible-extract
generation_kwargs:
  do_sample: false
  until:
  - 'Funso:'
  - </s>
  - <|im_end|>
task: mgsm_native_cot_nya
